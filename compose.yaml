name: web-console
services:
  web-console:
    image: ${WEBCONSOLE_IMAGE:-ghcr.io/keviince/web-console:latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PORTAL_URL: ${PORTAL_URL:?Set PORTAL_URL in .env}
      DEVICE_DOMAIN: ${DEVICE_DOMAIN:?Set DEVICE_DOMAIN in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_ALLOWED_SUB: ${OIDC_ALLOWED_SUB:?Set OIDC_ALLOWED_SUB in .env}
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - encryption_key
      - oidc_client_secret
    volumes:
      - web_console_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
secrets:
  encryption_key:
    file: ./secrets/encryption_key
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
volumes:
  web_console_data:
    name: ${DATA_VOLUME:-web-console_data}
